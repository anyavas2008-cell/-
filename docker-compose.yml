services:
  db:
    image: postgres:15-alpine
    container_name: carpool_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carpool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    container_name: carpool_bot
    restart: always
    depends_on:
      - db
    env_file:
      - .env

volumes:
  pgdata: